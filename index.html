<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spotpreis AT · 15 min</title>
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spotpreis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0b0f14;--card:#121821;--card2:#18202b;--line:#243041;--txt:#e6edf3;--mute:#8b98a9;
    --acc:#4cc9f0;--good:#22c55e;--mid:#eab308;--bad:#ef4444;--neg:#38bdf8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#132235 0,var(--bg) 60%);color:var(--txt);
       font:12px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;
        padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
  html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  .days::-webkit-scrollbar{display:none} .days{scrollbar-width:none}
  .stats,.list{min-width:0} .stats>*{min-width:0}
  #bestTxt{white-space:nowrap}
  #upd{cursor:pointer}
  header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
  h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  h1 span{color:var(--mute);font-weight:400;font-size:11px;margin-left:5px}
  .ctrls{display:flex;flex-wrap:nowrap;gap:5px;align-items:center;min-width:0}
  .seg{display:inline-flex;flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg button{background:none;border:0;color:var(--mute);padding:4px 8px;border-radius:6px;cursor:pointer;font:inherit;white-space:nowrap}
  .seg button.on{background:var(--card2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
  label.in{display:inline-flex;flex:0 1 auto;min-width:0;gap:3px;align-items:center;background:var(--card);border:1px solid var(--line);
           border-radius:8px;padding:2px 7px;color:var(--mute);white-space:nowrap}
  /* 16px verhindert das automatische Hineinzoomen von iOS beim Antippen */
  label.in input{width:40px;min-width:0;background:transparent;border:0;color:var(--txt);font:inherit;font-size:16px;text-align:right;outline:none;padding:0}
  .sm{display:none}
  @media(max-width:600px){
    h1 span{display:block;margin:1px 0 0}
    .ctrls{width:100%;justify-content:space-between} .seg button{padding:4px 7px}
    .lg{display:none} .sm{display:inline}
    .now .big{font-size:32px} svg{height:150px}
    .card{padding:9px}
  }
  .days{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px}
  .day{flex:0 0 auto;min-width:50px;text-align:center;background:var(--card);border:1px solid var(--line);line-height:1.2;
       border-radius:9px;padding:4px 4px;cursor:pointer;color:var(--mute);user-select:none;font-size:11px}
  .day b{display:block;font-size:15px;color:var(--txt);font-weight:600}
  .day.on{border-color:var(--acc);background:#0f2533}
  .day.na{opacity:.35;cursor:default}
  .card{background:linear-gradient(180deg,var(--card),#0f141b);border:1px solid var(--line);border-radius:12px;padding:12px}
  .now{margin-bottom:10px;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:8px 14px;align-items:center}
  @media(max-width:760px){.now{grid-template-columns:minmax(0,1fr)}}
  .now .lbl{color:var(--mute);font-size:11px}
  .now .big{font-size:40px;font-weight:700;line-height:1;margin:3px 0 0;font-variant-numeric:tabular-nums}
  .now .unit{color:var(--mute);font-size:12px;font-weight:400;margin-left:4px}
  .now .split{margin-top:4px;color:var(--mute);font-size:10.5px;font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
  .stat{background:var(--card2);border-radius:8px;padding:4px 7px;border:1px solid var(--line)}
  .stat .k{color:var(--mute);font-size:10px}
  .stat .v{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat .s{color:var(--mute);font-size:10px}
  .best{grid-column:1/-1;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;display:flex;
        justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
  .best select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:1px 18px 1px 6px;font:inherit;font-size:16px;
               -webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
               background-position:calc(100% - 10px) 55%,calc(100% - 6px) 55%;background-size:4px 4px;background-repeat:no-repeat}
  .chart{position:relative}
  svg{display:block;width:100%;height:208px}
  .tip{position:absolute;pointer-events:none;background:#0b1118ee;border:1px solid var(--line);border-radius:6px;
       padding:4px 6px;font-size:10px;transform:translate(-50%,-110%);white-space:nowrap;display:none}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:3px;margin-top:10px}
  .row{display:grid;grid-template-columns:82px minmax(0,1fr) 46px;gap:6px;align-items:center;background:var(--card);line-height:1.2;
       border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
  .row.cur{outline:2px solid var(--acc)}
  .row.past{opacity:.45}
  .row .t{color:var(--mute);font-size:11px}
  .row .bar{height:6px;background:#1f2a38;border-radius:4px;overflow:hidden}
  .row .bar i{display:block;height:100%;border-radius:4px}
  .row .p{text-align:right;font-weight:600}
  .msg{color:var(--mute);padding:24px;text-align:center}
  footer{margin-top:14px;color:var(--mute);font-size:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  footer a{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚡ Spotpreis Österreich<span>EPEX Day‑Ahead · 15‑Minuten</span></h1>
    <div class="ctrls">
      <div class="seg" id="res"><button data-v="15" class="on">15 min</button><button data-v="60">1 h</button></div>
      <div class="seg" id="vat"><button data-v="1" class="on"><span class="lg">inkl. 20% MwSt</span><span class="sm">brutto</span></button><button data-v="0">netto</button></div>
      <label class="in" title="Aufschlag deines Anbieters (netto)"><span class="lg">Aufschlag</span><span class="sm">+</span> <input id="fee" type="number" inputmode="decimal" step="0.01" value="0"> ct</label>
    </div>
  </header>

  <div class="days" id="days"></div>

  <div class="card now">
    <div>
      <div class="lbl" id="nowLbl">Aktueller Preis</div>
      <div class="big"><span id="nowPrice">–</span><span class="unit">ct/kWh</span></div>
      <div class="split" id="nowSplit"></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">↓ Min</div><div class="v" id="sMin">–</div><div class="s" id="sMinT"></div></div>
      <div class="stat"><div class="k">Ø Mittel</div><div class="v" id="sAvg">–</div><div class="s">ganzer Tag</div></div>
      <div class="stat"><div class="k">↑ Max</div><div class="v" id="sMax">–</div><div class="s" id="sMaxT"></div></div>
    </div>
    <div class="best">
      <span>Günstigstes Fenster
        <select id="win"><option value="1">1 h</option><option value="2" selected>2 h</option><option value="3">3 h</option><option value="4">4 h</option></select>
      </span>
      <b id="bestTxt">–</b>
    </div>
  </div>

  <div class="card chart"><svg id="svg"></svg><div class="tip" id="tip"></div></div>
  <div class="list" id="list"></div>

  <footer>
    <span id="upd"></span>
    <span>Daten: <a href="https://energy-charts.info" target="_blank" rel="noopener">Energy‑Charts / Fraunhofer ISE</a> (CC BY 4.0, Bundesnetzagentur | SMARD.de)</span>
  </footer>
</div>

<script>
const TZ = "Europe/Vienna";
const $ = id => document.getElementById(id);
const S = JSON.parse(localStorage.getItem("spot-at") || "{}");
const state = { res: S.res || 15, vat: S.vat ?? 1, fee: S.fee || 0, win: S.win || 2, day: null, byDay: {}, raw: [] };
const save = () => localStorage.setItem("spot-at", JSON.stringify({ res: state.res, vat: state.vat, fee: state.fee, win: state.win }));

// Locale-independent formatting: browsers (esp. iOS Safari) differ in Intl output strings, so build keys from parts
const fmtDate = new Intl.DateTimeFormat("en-US", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const fmtTime = new Intl.DateTimeFormat("de-AT", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const fmtDay = new Intl.DateTimeFormat("de-AT", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
const fmtWd = new Intl.DateTimeFormat("de-AT", { timeZone: "UTC", weekday: "short" });
const MONTHS = ["Jän.", "Feb.", "März", "Apr.", "Mai", "Juni", "Juli", "Aug.", "Sep.", "Okt.", "Nov.", "Dez."];
const parts = (f, d) => Object.fromEntries(f.formatToParts(d).map(p => [p.type, p.value]));
const dayKey = t => { const p = parts(fmtDate, new Date(t * 1000)); return `${p.year}-${p.month}-${p.day}`; };
const hm = t => fmtTime.format(new Date(t * 1000));
const addDays = (key, n) => { const d = new Date(key + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

// €/MWh -> ct/kWh, plus net surcharge, optionally VAT
const price = eurMwh => { const net = eurMwh / 10 + Number(state.fee); return state.vat ? net * 1.2 : net; };
const f2 = v => v.toLocaleString("de-AT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function slots(day) {
  const q = state.byDay[day] || [];
  if (state.res === 15) return q.map(x => ({ t: x.t, d: 900, p: x.p }));
  // Correct hourly value = arithmetic mean of the four 15-min quarters (UTC hour == local hour in AT)
  const h = new Map();
  for (const x of q) { const k = Math.floor(x.t / 3600) * 3600; (h.get(k) || h.set(k, []).get(k)).push(x.p); }
  return [...h].map(([t, a]) => ({ t, d: 3600, p: a.reduce((s, v) => s + v, 0) / a.length }));
}

function color(v, min, max) {
  if (v < 0) return "var(--neg)";
  const r = max > min ? (v - Math.max(min, 0)) / (max - Math.max(min, 0)) : 0.5;
  return `hsl(${Math.round(130 * (1 - Math.min(Math.max(r, 0), 1)))} 70% 48%)`;
}

async function load() {
  const today = dayKey(Date.now() / 1000);
  try {
    const r = await fetch("prices.json?_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    state.byDay = {};
    for (const x of j.prices) (state.byDay[dayKey(x.t)] ||= []).push(x);
    const u = new Date(j.updated);
    $("upd").textContent = `Daten vom ${fmtDay.format(u)} ${fmtTime.format(u)} · ⟳ tippen zum Aktualisieren`;
  } catch (e) { $("upd").textContent = "Fehler beim Laden: " + e.message; }
  if (!state.day || !state.byDay[state.day]) state.day = today;
  try { render(); } catch (e) { showErr(e); }
}

// Surface errors on the page itself – there is no dev console on the phone
function showErr(e) {
  const m = (e && (e.message || e.reason && e.reason.message)) || String(e);
  $("upd").textContent = "Fehler: " + m;
}
window.addEventListener("error", showErr);
window.addEventListener("unhandledrejection", showErr);

function renderDays() {
  const today = dayKey(Date.now() / 1000);
  $("days").innerHTML = "";
  for (let i = -6; i <= 1; i++) {
    const k = addDays(today, i), has = !!state.byDay[k];
    const el = document.createElement("div");
    el.className = "day" + (k === state.day ? " on" : "") + (has ? "" : " na");
    const kd = new Date(k + "T12:00:00Z");
    const wd = fmtWd.format(kd).replace(/\.?$/, ".");
    el.innerHTML = `${i === 0 ? "Heute" : i === 1 ? "Morgen" : wd}<b>${kd.getUTCDate()}</b>${MONTHS[kd.getUTCMonth()]}`;
    if (i === 1 && !has) el.title = "Day‑Ahead Preise werden ca. 13:00 veröffentlicht";
    if (has) el.onclick = () => { state.day = k; render(); };
    $("days").appendChild(el);
  }
  const d = $("days"), on = d.querySelector(".on");
  if (on) d.scrollLeft = on.offsetLeft - d.offsetLeft - d.clientWidth / 2 + on.clientWidth / 2;
}

function render() {
  renderDays();
  const now = Date.now() / 1000;
  const s = slots(state.day).map(x => ({ ...x, v: price(x.p) }));
  if (!s.length) { $("list").innerHTML = `<div class="msg">Keine Daten für diesen Tag.</div>`; $("svg").innerHTML = ""; return; }

  const vals = s.map(x => x.v), min = Math.min(...vals), max = Math.max(...vals);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const iMin = vals.indexOf(min), iMax = vals.indexOf(max);
  const cur = s.find(x => now >= x.t && now < x.t + x.d);

  // Hero
  const ref = cur || s[0];
  $("nowLbl").textContent = cur ? `Jetzt · ${hm(cur.t)} – ${hm(cur.t + cur.d)}` : `${fmtDay.format(new Date(ref.t * 1000))} · ${hm(ref.t)} – ${hm(ref.t + ref.d)}`;
  $("nowPrice").textContent = f2(ref.v);
  $("nowPrice").style.color = color(ref.v, min, max);
  const net = ref.p / 10 + Number(state.fee);
  $("nowSplit").textContent = `Börse ${f2(ref.p / 10)} ct` + (Number(state.fee) ? ` + Aufschlag ${f2(Number(state.fee))} ct` : "") +
    (state.vat ? ` + MwSt ${f2(net * 0.2)} ct` : " (netto)") + ` · ${f2(ref.p)} €/MWh`;

  $("sMin").textContent = f2(min); $("sMinT").textContent = `${hm(s[iMin].t)} – ${hm(s[iMin].t + s[iMin].d)}`;
  $("sMax").textContent = f2(max); $("sMaxT").textContent = `${hm(s[iMax].t)} – ${hm(s[iMax].t + s[iMax].d)}`;
  $("sAvg").textContent = f2(avg);
  [["sMin", min], ["sMax", max], ["sAvg", avg]].forEach(([id, v]) => $(id).style.color = color(v, min, max));

  // Cheapest contiguous window (only future slots for today), on 15-min base for precision
  const q = (state.byDay[state.day] || []).filter(x => x.t + 900 > now);
  const n = state.win * 4;
  let best = null;
  for (let i = 0; i + n <= q.length; i++) {
    const a = q.slice(i, i + n).reduce((acc, x) => acc + price(x.p), 0) / n;
    if (!best || a < best.a) best = { a, t: q[i].t, e: q[i + n - 1].t + 900 };
  }
  $("bestTxt").textContent = best ? `${hm(best.t)} – ${hm(best.e)} · Ø ${f2(best.a)} ct` : "kein Fenster mehr heute";

  drawChart(s, min, max, avg, cur, now);

  // List
  $("list").innerHTML = s.map(x => {
    const w = max > Math.min(min, 0) ? ((x.v - Math.min(min, 0)) / (max - Math.min(min, 0))) * 100 : 50;
    const cls = x === cur ? "row cur" : x.t + x.d <= now ? "row past" : "row";
    return `<div class="${cls}"><span class="t">${hm(x.t)} – ${hm(x.t + x.d)}</span>
      <span class="bar"><i style="width:${Math.max(w, 2)}%;background:${color(x.v, min, max)}"></i></span>
      <span class="p">${f2(x.v)}</span></div>`;
  }).join("");
}

function drawChart(s, min, max, avg, cur, now) {
  const svg = $("svg"), W = svg.clientWidth || 1000, H = svg.clientHeight || 208, P = { l: 30, r: 6, t: 8, b: 18 };
  const lo = Math.min(0, min), hi = max <= lo ? lo + 1 : max * 1.05;
  const y = v => P.t + (H - P.t - P.b) * (1 - (v - lo) / (hi - lo));
  const bw = (W - P.l - P.r) / s.length;
  let g = "";
  const step = Math.max(1, Math.round((hi - lo) / 5 / 5) * 5) || 1;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#243041" stroke-width="1"/>
          <text x="${P.l - 4}" y="${y(v) + 4}" fill="#8b98a9" font-size="9" text-anchor="end">${v}</text>`;
  s.forEach((x, i) => {
    const X = P.l + i * bw, y0 = y(0), yv = y(x.v);
    const past = x.t + x.d <= now;
    g += `<rect data-i="${i}" x="${X + bw * 0.12}" y="${Math.min(y0, yv)}" width="${bw * 0.76}" height="${Math.max(1, Math.abs(y0 - yv))}"
           rx="${Math.min(3, bw / 4)}" fill="${color(x.v, min, max)}" opacity="${past ? 0.4 : 1}" ${x === cur ? 'stroke="#fff" stroke-width="1.5"' : ""}/>`;
    const lt = hm(x.t);
    if (lt.endsWith(":00") && Number(lt.slice(0, 2)) % 3 === 0)
      g += `<text x="${X}" y="${H - 5}" fill="#8b98a9" font-size="9">${lt.slice(0, 2)}</text>`;
  });
  g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(avg)}" y2="${y(avg)}" stroke="#4cc9f0" stroke-dasharray="4 4" opacity=".7"/>`;
  if (cur) { const X = P.l + (s.indexOf(cur) + (now - cur.t) / cur.d) * bw; g += `<line x1="${X}" x2="${X}" y1="${P.t}" y2="${H - P.b}" stroke="#fff" opacity=".6"/>`; }
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = g;
  svg.onmousemove = e => {
    const i = Math.floor((e.offsetX - P.l) / bw), x = s[i], tip = $("tip");
    if (!x) return tip.style.display = "none";
    tip.style.display = "block"; tip.style.left = e.offsetX + "px"; tip.style.top = e.offsetY + "px";
    tip.innerHTML = `${hm(x.t)} – ${hm(x.t + x.d)}<br><b>${f2(x.v)} ct/kWh</b>`;
  };
  svg.onmouseleave = () => $("tip").style.display = "none";
}

// Controls
function seg(id, key, cast = Number) {
  const el = $(id);
  el.querySelectorAll("button").forEach(b => b.classList.toggle("on", cast(b.dataset.v) === state[key]));
  el.onclick = e => { const t = e.target.closest("button"); if (!t || !t.dataset.v) return; state[key] = cast(t.dataset.v);
    el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === t)); save(); render(); };
}
seg("res", "res"); seg("vat", "vat");
$("fee").value = state.fee; $("fee").oninput = e => { state.fee = Number(e.target.value) || 0; save(); render(); };
$("win").value = state.win; $("win").onchange = e => { state.win = Number(e.target.value); save(); render(); };
window.onresize = () => render();

$("upd").onclick = load;

load();
setInterval(load, 5 * 60 * 1000);
setInterval(render, 30 * 1000);
// iOS home-screen apps are resumed, not reloaded -> refresh when coming back to foreground
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
