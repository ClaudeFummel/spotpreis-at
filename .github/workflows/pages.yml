name: Preise aktualisieren & Pages deployen

on:
  schedule:
    # alle 5 min, Rund um die volle Stunde (:57-:02) ausgespart, da GitHub dort überlastet ist
    - cron: "7-52/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Site zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icons _site/
          python scripts/fetch_prices.py _site/prices.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
